name: Generate Languages Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/languages.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate languages graph
        uses: cicirello/user-statistician@v1
        with:
          image-file: languages.svg
          colors: dark
          hide-keys: general, contributions, repositories
          max-languages: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
